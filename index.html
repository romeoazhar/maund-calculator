<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maund & Ser Price Calculator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b71f4">
  <style>
    :root{
      --card-width: 420px;
      --accent: #0b71f4;
      --bg: #f5f7fb;
      --card: #ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:var(--card-width);
      background:var(--card);
      border-radius:12px;
      padding:22px;
      box-shadow:0 8px 28px rgba(11,23,58,0.08);
    }

    h1{
      margin:0 0 10px 0;
      font-size:20px;
      color:#123;
      text-align:center;
    }
    p.lead{
      margin:0 0 18px 0;
      color:#556;
      font-size:13px;
      text-align:center;
    }

    label{display:block; font-size:13px; color:#334; margin-top:10px}
    input[type="number"]{
      width:100%;
      padding:12px 10px;
      border-radius:8px;
      border:1px solid #d0d6df;
      margin-top:6px;
      font-size:16px;
      background:#fbfdff;
      outline:none;
    }
    input[type="number"]:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(11,113,244,0.06);
    }

    button{
      width:100%;
      padding:12px;
      margin-top:14px;
      border-radius:8px;
      border:none;
      background:var(--accent);
      color:white;
      font-size:16px;
      cursor:pointer;
    }
    button:active{transform:translateY(1px)}
    .result{
      margin-top:14px;
      padding:12px;
      border-radius:8px;
      background:#f3f8ff;
      border:1px solid #dceeff;
      color:#0b3a7a;
      font-weight:600;
      line-height:1.4;
      word-break:break-word;
    }

    .words{
      margin-top:8px;
      padding:10px 12px;
      border-radius:8px;
      background:#fff8ec;
      border:1px solid #ffe3b0;
      color:#8a5a00;
      font-size:13px;
      font-style:italic;
      line-height:1.4;
    }

    .small{
      font-size:13px;
      color:#556;
      margin-top:8px;
      text-align:center;
    }

    @media (max-width:480px){
      .card{padding:16px}
      h1{font-size:18px}
    }
  </style>
</head>
<body>

  <div class="card" role="application" aria-labelledby="title">
    <h1 id="title">Maund &amp; KG Price Calculator</h1>
    <p class="lead">Enter price per maund and total weight in KG — Maund.KG is calculated automatically.</p>

    <label for="priceM">Price per Maund (PKR / unit)</label>
    <input id="priceM" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 4000">

    <label for="kgInput">Enter Weight in KG</label>
    <input id="kgInput" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 100">

    <button id="calcBtn" type="button">Calculate</button>

    <div id="result" class="result" aria-live="polite">Result will appear here.</div>
    <div id="wordsResult" class="words" style="display:none;"></div>

    <p class="small">Notes: 1 maund = 40 kg. Enter total weight directly in KG; the app converts it to Maund.KG automatically.</p>
    <p style="margin-top:12px;font-size:12px;color:#888;text-align:center;">Made by Romeo Azhar</p>
  </div>

<script>
(function(){
  const MAUND_KG = 40;
  const priceEl = document.getElementById('priceM');
  const kgEl = document.getElementById('kgInput');
  const btn = document.getElementById('calcBtn');
  const out = document.getElementById('result');
  const wordsOut = document.getElementById('wordsResult');

  function showMessage(html){
    out.innerHTML = html;
  }

  const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
    "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen",
    "Seventeen", "Eighteen", "Nineteen"];
  const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

  function twoDigits(n){
    if(n < 20) return ones[n];
    const t = Math.floor(n/10), o = n%10;
    return tens[t] + (o ? " " + ones[o] : "");
  }

  function threeDigits(n){
    const h = Math.floor(n/100), r = n%100;
    let str = "";
    if(h) str += ones[h] + " Hundred";
    if(r){
      if(str) str += " ";
      str += twoDigits(r);
    }
    return str;
  }

  function numberToWords(num){
    num = Math.round(num);
    if(num === 0) return "Zero";
    if(num < 0) return "Minus " + numberToWords(-num);

    const crore = Math.floor(num / 10000000);
    num %= 10000000;
    const lakh = Math.floor(num / 100000);
    num %= 100000;
    const thousand = Math.floor(num / 1000);
    num %= 1000;
    const rest = num;

    let parts = [];
    if(crore) parts.push(threeDigits(crore) + " Crore");
    if(lakh) parts.push(twoDigits(lakh) + " Lakh");
    if(thousand) parts.push(twoDigits(thousand) + " Thousand");
    if(rest) parts.push(threeDigits(rest));

    return parts.join(" ");
  }

  function amountToWords(amount){
    const rupees = Math.floor(amount);
    const paisaExact = Math.round((amount - rupees) * 100);
    let words = numberToWords(rupees) + " Rupees";
    if(paisaExact > 0){
      words += " and " + numberToWords(paisaExact) + " Paisa";
    }
    return words + " only";
  }

  function calculate(){
    const priceVal = priceEl.value;
    const kgVal = kgEl.value;

    if(priceVal === "" || kgVal === ""){
      showMessage('<span style="color:#b30">Please enter both fields.</span>');
      wordsOut.style.display = "none";
      return;
    }

    const pricePerMaund = Number(priceVal);
    const totalKg = Number(kgVal);

    if(isNaN(pricePerMaund) || pricePerMaund < 0){
      showMessage('<span style="color:#b30">Enter a valid positive price.</span>');
      wordsOut.style.display = "none";
      return;
    }
    if(isNaN(totalKg) || totalKg < 0){
      showMessage('<span style="color:#b30">Enter a valid positive weight in KG.</span>');
      wordsOut.style.display = "none";
      return;
    }

    const maunds = Math.floor(totalKg / MAUND_KG);
    const kgs = totalKg % MAUND_KG;
    const kgsDisplay = kgs.toFixed(2).replace(/\.?0+$/, '') || '0';

    const pricePerKg = pricePerMaund / MAUND_KG;
    const totalPrice = pricePerKg * totalKg;

    showMessage(
      `Weight: <strong>${maunds} Maund ${kgsDisplay} KG</strong> (${totalKg} kg total)<br>` +
      `Price per KG: <strong>${pricePerKg.toFixed(2)}</strong><br>` +
      `Final Amount: <strong>${totalPrice.toFixed(2)}</strong>`
    );

    wordsOut.textContent = amountToWords(totalPrice);
    wordsOut.style.display = "block";

    priceEl.value = "";
    kgEl.value = "";
    priceEl.focus();
  }

  btn.addEventListener('click', calculate);

  [priceEl, kgEl].forEach(el=>{
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter') {
        e.preventDefault();
        calculate();
      }
    });
  });
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
